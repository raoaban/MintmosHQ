<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MINTMOS Content &amp; Growth OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one/index.css">
<style>
:root{
  --bg:#121212; --panel:#1C1C2E; --panel2:#232339; --line:#2D2D47; --line2:rgba(250,250,250,.09);
  --text:#FAFAFA; --muted:#A5A5BA; --dim:#76768E; --accent:#AFFF00; --ink:#121212;
  --bad:#FF7A7A; --warn:#E8C25A; --r:4px;
  --font:"Open Sauce One","Open Sauce Sans","Open Sauce","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter","Open Sauce One",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--font);margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15} h2{font-size:20px} h3{font-size:14px;letter-spacing:.02em;margin-bottom:14px} h4{font-size:15px;margin:2px 0 6px}
p{margin:0 0 10px} button{font:inherit;color:inherit;cursor:pointer} a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .sm{font-size:12px} .dim{color:var(--dim)} .nowrap{white-space:nowrap}
.ok-t{color:var(--accent)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.eyebrow{font:600 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--bg);border-right:1px solid var(--line2);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 10px 18px}
.brand b{font:700 16px var(--font);letter-spacing:.14em}
.brand span{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.brand i{width:7px;height:7px;background:var(--accent);display:inline-block;align-self:center}
.nav-g{margin-bottom:16px}
.nav-gt{font:600 10px var(--font);letter-spacing:.16em;color:var(--dim);padding:0 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:8px 10px;color:var(--muted);border-radius:0 var(--r) var(--r) 0}
.nav-i:hover{background:var(--panel);color:var(--text)}
.nav-i.on{background:var(--panel);color:var(--text);border-left-color:var(--accent)}
.ni{width:16px;text-align:center;color:var(--dim)} .nav-i.on .ni{color:var(--accent)}
.content{min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;padding:10px 28px}
.top .grow{flex:1}
#menuBtn{display:none}
.search-btn{display:flex;align-items:center;gap:10px;min-width:260px;max-width:420px;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;color:var(--muted);text-align:left}
.search-btn kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);padding:1px 6px;border-radius:3px;color:var(--dim)}
.save-ind{font-size:12px;color:var(--dim);white-space:nowrap} .save-ind.ok{color:var(--muted)} .save-ind.err{color:var(--bad)}
#main{padding:26px 28px 80px;max-width:1280px}

/* components */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h p{margin:6px 0 0;max-width:760px}
.page-a,.card-a,.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-a{margin-top:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;color:var(--text);font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#4a4a6e;background:#2a2a45}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600} .btn.primary:hover{background:#c2ff3a}
.btn.ghost{background:transparent} .btn.danger{background:transparent;color:var(--bad);border-color:#5a2d33} .btn.danger:hover{background:#2c1a1f}
.btn.danger-g{background:transparent;color:#d49a9a;border-color:transparent} .btn.danger-g:hover{color:var(--bad);border-color:#5a2d33}
.btn.sm{padding:5px 10px;font-size:12px} .btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.file{cursor:pointer}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-align:left}
.icon-btn{background:none;border:0;color:var(--muted);font-size:16px;padding:4px 8px;border-radius:var(--r)} .icon-btn:hover{color:var(--text);background:var(--panel2)}
.star.on{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.feature{border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .grid>.card{margin-bottom:0} .grid{margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:14px} .cards>.card{margin:0;display:flex;flex-direction:column} .cards>.card .card-a{margin-top:auto;padding-top:12px}
.cards-s{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--dim);padding:10px 14px;border-radius:var(--r);margin-bottom:14px;font-size:13px}
.note.warn{border-left-color:var(--warn)}
.sec{margin:26px 0 12px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:11px;color:var(--muted);line-height:1.5;white-space:nowrap}
.chip.fmt{color:var(--text)}
.chip.int-direct{border-color:var(--accent);color:var(--accent)} .chip.int-soft{border-color:#6b8a00;color:#c7e66a} .chip.int-indirect{color:var(--muted)} .chip.int-none{color:var(--dim)}
.chip.st-ok{color:var(--accent);border-color:#5f7f00} .chip.st-part{color:var(--warn);border-color:#6d5a22} .chip.st-bad{color:var(--bad);border-color:#6a3338} .chip.st-mute{color:var(--dim)} .chip.st-now{color:var(--text);border-color:var(--text)}
.chip.stage-published{color:var(--accent);border-color:#5f7f00} .chip.stage-ready{color:var(--text)} .chip.stage-research,.chip.stage-designing,.chip.stage-review{color:var(--warn);border-color:#6d5a22}
.chip.ph1,.chip.ph2,.chip.ph3{color:var(--dim)}
.chip.cat{padding-right:2px} .chip .x{background:none;border:0;color:var(--dim);padding:0 6px;font-size:14px} .chip .x:hover{color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 10px/1.6 var(--font);letter-spacing:.1em;border:1px solid var(--line);border-radius:3px;padding:1px 8px 1px 7px;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--bc)}
.prio{font-size:11px;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted)} .prio.p-high{color:var(--warn);border-color:#6d5a22}
.bar{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden} .bar span{display:block;height:100%;background:var(--accent)} .bar.lg{height:10px} .bar.dim span{background:#7f9f2a} .bar.ok span{background:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);white-space:nowrap} .tab small{color:var(--dim);margin-left:4px} .tab:hover{color:var(--text)} .tab.on{color:var(--text);border-bottom-color:var(--accent)}
.seg-ctl{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden} .seg-ctl button{background:none;border:0;padding:8px 14px;color:var(--muted)} .seg-ctl button.on{background:var(--panel2);color:var(--text)}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:var(--r);background:var(--panel)} .empty-t{font:600 16px var(--font);margin-bottom:6px} .empty p{color:var(--muted);max-width:520px;margin:0 auto 14px} .empty-s{padding:16px;color:var(--muted);text-align:center;font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.flt{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);min-width:120px} .flt.grow{flex:1;min-width:200px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
select{padding-right:28px} input::placeholder,textarea::placeholder{color:var(--dim)} textarea{resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
input[type=search]{-webkit-appearance:none;appearance:none}
.sel-s{padding:4px 6px;font-size:12px;width:auto;max-width:150px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin-bottom:14px} .k3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))} .k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi-l{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px} .kpi-v{font:600 26px/1.1 var(--font)} .kpi-s{font-size:11px;color:var(--dim);margin-top:6px}
.kpi.ok .kpi-v{color:var(--accent)} .kpi.part .kpi-v{color:var(--warn)} .kpi.bad .kpi-v{color:var(--bad)}
.big-pct{font:700 54px/1 var(--font);margin-bottom:10px} .big-pct span{font-size:24px;color:var(--muted)}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px} .split>div{min-width:0}
.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.mini-v{font:600 28px/1 var(--font)} .mini-l{font-size:11px;color:var(--dim);margin-top:4px}
.row-b{display:flex;justify-content:space-between;font-size:12px;margin:6px 0 4px}
.wk{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:6px;height:110px;margin-bottom:10px}
.wk-c{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;height:100%}
.wk-bar{flex:1;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:2px;display:flex;align-items:flex-end;overflow:hidden} .wk-bar i{display:block;width:100%;background:var(--accent)}
.wk-n{font-size:10px;color:var(--dim)} .wk-c:hover .wk-n{color:var(--text)}
.heat{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:4px;margin-bottom:12px}
.hd{aspect-ratio:1;font-size:10px;border:1px solid var(--line);background:var(--bg);color:var(--dim);border-radius:2px;padding:0;display:flex;align-items:center;justify-content:center;min-width:0}
.hd.s-completed{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700} .hd.s-partial{background:#5b4a17;color:var(--warn);border-color:#6d5a22} .hd.s-missed,.hd.s-overdue{background:#4a2227;color:var(--bad);border-color:#6a3338} .hd.s-skipped{background:#2a2a3a;color:var(--dim);border-style:dashed} .hd.s-today{border-color:var(--text);color:var(--text)} .hd.focus{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)} .legend span{display:inline-flex;align-items:center;gap:6px} .legend .hd{width:12px;aspect-ratio:1;display:inline-block} .legend .seg{display:inline-block;width:12px;height:8px}
.legend.l2{margin-bottom:12px}
.dist{display:grid;grid-template-columns:230px 1fr 190px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)} .dist:last-of-type{border-bottom:0}
.dist-l{display:flex;flex-direction:column;gap:2px;align-items:flex-start} .dist-t{display:flex;height:12px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden} .dist-r{font-size:12px;color:var(--muted);text-align:right}
.seg{display:block;height:100%} .int-bg-direct{background:var(--accent)} .int-bg-soft{background:#7a9b0c} .int-bg-indirect{background:#4a4a68} .int-bg-none{background:#2d2d44}
.alist{list-style:none;padding:0;margin:0 0 12px} .alist li{padding:8px 12px;border-left:3px solid var(--dim);background:var(--bg);margin-bottom:6px;font-size:13px;border-radius:0 var(--r) var(--r) 0} .alist li.warn{border-left-color:var(--warn)} .alist li.bad{border-left-color:var(--bad)} .alist li.ok{border-left-color:var(--accent)}
.focus-h{font:600 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px} .focus-h:first-child{margin-top:0}
.focus-i{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px} .focus-i:hover{border-color:var(--accent)} .focus-i small{color:var(--dim)} .focus-i span{display:flex;gap:6px;flex-wrap:wrap}

/* roadmap */
.weeks{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:6px;margin-bottom:14px} .wchip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 4px;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:11px;color:var(--muted)} .wchip.on{border-color:var(--accent);color:var(--text)} .wbar{display:block;width:100%;height:3px;background:var(--bg)} .wbar i{display:block;height:100%;background:var(--accent)}
.week-h{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin:6px 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line2)} .week-h p{max-width:700px;margin:6px 0 0} .week-s{min-width:170px;text-align:right} .week-s b{font:600 22px var(--font)} .week-s span{color:var(--muted);margin-left:6px;font-size:12px} .week-s .bar{margin-top:8px}
.week-nav{display:flex;justify-content:space-between;margin:18px 0}
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;scroll-margin-top:70px} .day.s-completed{border-color:#5f7f00} .day.s-partial{border-color:#6d5a22} .day.s-missed,.day.s-overdue{border-color:#6a3338}
.day-h{padding:14px 16px;border-bottom:1px solid var(--line2)} .day-t{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .day-n{font:700 18px var(--font)} .day-m{display:flex;gap:18px;font-size:12px;color:var(--muted);margin:6px 0 10px;flex-wrap:wrap} .day-a{display:flex;gap:6px;flex-wrap:wrap}
.day-ref{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.pc{border-bottom:1px solid var(--line2);padding:12px 16px} .pc:last-child{border-bottom:0} .pc.published{background:rgba(175,255,0,.03)}
.pc-h{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.pc-t{background:none;border:0;text-align:left;padding:0;flex:1;display:flex;flex-direction:column;gap:8px} .pc-t b{font:600 15px/1.35 var(--font)} .pc-t:hover b{color:var(--accent)}
.pc-p{width:130px;flex:none;text-align:right} .pc-pn{display:block;font-size:11px;color:var(--muted);margin-bottom:5px} .pc.published .pc-pn{color:var(--accent)}
.pc-warn{margin-top:8px;font-size:12px;color:var(--warn);background:#2a2412;border:1px solid #5a4a1d;padding:6px 10px;border-radius:var(--r)}
.pc-b{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.dir{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;margin:0 0 12px} .dir>div{min-width:0} .dir dt{font:600 10px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:3px} .dir dd{margin:0;font-size:13px}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0} .meta em{font-style:normal;color:var(--dim);margin-right:4px}
.steps{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px} .steps legend{font-size:11px;color:var(--muted);padding:0 6px;letter-spacing:.06em}
.step{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;cursor:pointer;color:var(--muted)} .step.on{color:var(--text)} .step.pub{grid-column:span 1;color:var(--text)} .step.pub.on span{color:var(--accent);font-weight:600}
.pc-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.checkpoint{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--panel2);border-top:1px solid var(--line)} .checkpoint.done b::before{content:"✓ ";color:var(--accent)}
.flash{animation:fl 1.6s ease-out} @keyframes fl{0%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 2px transparent}}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin-bottom:12px} .fld em{color:var(--accent);font-style:normal} .fld small{color:var(--dim)} .fld.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--text)}

/* pipeline */
.board{display:grid;grid-template-columns:repeat(7,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:200px} .col.over{border-color:var(--accent)}
.col-h{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line2);font-size:12px} .col-h span{color:var(--dim)}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px} .col-e{color:var(--dim);font-size:12px;text-align:center;padding:20px 0}
.pcard{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:grab} .pcard.dragging{opacity:.4} .pcard-t{margin-bottom:8px;font-size:13px} .pcard-t .link{color:var(--text);text-decoration:none;font-weight:500} .pcard-t .link:hover{color:var(--accent)}
.pcard-m{display:flex;gap:8px;font-size:11px;color:var(--muted);margin:8px 0;flex-wrap:wrap;align-items:center} .pcard-n{font-size:11px;color:var(--dim);margin-bottom:6px} .pcard-a{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pcard .badge{max-width:100%}
.tbl-w{overflow-x:auto} .tbl{width:100%;border-collapse:collapse;font-size:13px} .tbl th{font:600 10px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap} .tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top} .tbl tr:last-child td{border-bottom:0} .tl{font-weight:500;color:var(--text);text-decoration:none} .tl:hover{color:var(--accent)}
.inl-bar{width:80px;height:4px;background:var(--bg);display:inline-block;vertical-align:middle;margin-right:8px;border-radius:2px;overflow:hidden} .inl-bar span{display:block;height:100%;background:var(--accent)}
.hb{display:grid;grid-template-columns:200px 1fr 210px;gap:12px;align-items:center;padding:5px 0;font-size:12px} .hb-t{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden} .hb-t span{display:block;height:100%} .hb-r{text-align:right;color:var(--muted)} .hb-l{color:var(--muted)}

/* libraries */
.idea h4,.hook-t,.struct h4{font-weight:600} .hooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:14px}
.hook{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column} .hook-t{font:500 15px/1.4 var(--font);margin:6px 0 10px} .hook .card-a{margin-top:auto}

 { w:1, phase:1, theme:'Why MINTMOS exists', why:'Define the brand and the core problem: knowing a strategy is not the same as executing it. Collect the first audience-pain data.',
   rows:[
  R('brand','awareness','brand','none','The MINTMOS position: trading infrastructure for execution, not signals','Manifesto-style opener that states what MINTMOS stands for (process, risk, rules, review) and what it refuses to be (signal service, profit promises).','Day-one positioning filters the audience: the right traders self-select and the wrong expectations are removed early.','','Follow and save; a handful of replies saying which principle matters most to them.'),
  R('community','engagement','engage','none','Diagnostic question: what costs you the most — entries, exits, sizing or discipline?','Simple four-option question card. No teaching, no product mention. Treat the answers as research.','The comment split becomes first-hand evidence of which Phase 2 topics deserve depth.','','Comments with one of four answers, plus a line on why.'),
  R('foundations','awareness','brand','none','Knowing the strategy vs following your rules: the gap','One bold statement about traders who can explain their setup perfectly and still break their own rules in live conditions.','Names the central problem the whole 105 days builds on, in a way people recognise from their own screen time.','','Saves and shares from traders who feel the gap.'),
  R('risk','education','tes','indirect','The three numbers behind every trade: risk %, reward-to-risk and position size','Step-by-step explanation of how the three numbers lock together so that size follows from the stop, not from feel.','Risk-first thinking is the foundation of everything later, and it is the first honest step towards structured execution.','Naturally leads to Trader Execution System Pro, which calculates lot size from the stop and verifies R:R against a 1:2 minimum.','Saves; replies asking for a worked example.'),
  R('myths','education','none','none','Myth: you need a high win rate to be profitable','Break-even win rate vs reward-to-risk: show how the required win rate falls as R:R rises, with costs acknowledged.','Corrects the most common misunderstanding about edge and sets up the idea that structure beats prediction.','','Shares from traders who thought win rate was everything; debate in comments.'),
  R('psychology','education','cts','indirect','Why good traders still break their own rules: the four emotional traps','Overview of the traps that appear after a loss, a miss or a winning run. Name them without offering a full fix yet.','Reframes rule-breaking as predictable behaviour rather than a personal flaw, which builds trust and sets up later psychology content.','Connects to the psychology module of Complete Trading System (the four traps).','Saves; comments identifying which trap they fall into.'),
  R('community','engagement','engage','none','Self-score: how many of your last 10 trades followed your own plan?','Single question card asking for an honest number, with permission to answer anonymously in the comments.','Rule adherence is the metric most traders never measure; asking makes the problem concrete.','','Honest numeric comments; high comment count.'),
  R('brand','awareness','brand','none','Week 1 recap: five ideas worth saving','Compact reference image summarising the week’s ideas in one line each. Light day to leave time for the first weekly review.','Gives new followers a single save-worthy artefact and closes the first week cleanly.','','Saves and profile visits.')
 ]},
 { w:2, phase:1, theme:'Risk comes first', why:'Teach the risk fundamentals that every later topic depends on. Position sizing is the first practical skill.',
   rows:[
  R('risk','education','tes','indirect','What 1% risk really means in dollars','Translate a percentage into a dollar amount on a few account sizes so the abstract rule becomes a number a trader can feel.','Most traders quote a risk percentage without ever converting it; seeing the dollar value changes behaviour.','Relevant to the lot-size calculation in Trader Execution System Pro.','Saves; comments sharing their own risk-per-trade.'),
  R('community','engagement','engage','none','Where is your line: would you risk 10% on a single trade?','Provocative question card that invites people to state their maximum risk and defend it.','Creates healthy debate, exposes risk culture and gives material for the next risk posts.','','Debate in comments; shares to friends.'),
  R('risk','education','none','none','Break-even win rate by R:R: a one-image reference table','Clean table of required win rate at 1:1, 1:2, 1:3 and so on. No commentary beyond a single takeaway line.','A pure utility post people save and return to; reinforces the previous week’s myth with a tool.','','Saves (primary metric).'),
  R('sizing','education','tes','indirect','Position-size formula, step by step','Walk through account → risk % → stop distance → size using one numeric example the creator builds.','Shows that size is derived, not chosen, which is the practical heart of risk management.','Complete Trading System also teaches the position-size formula; Execution System Pro automates it.','Saves and shares; questions about instruments.'),
  R('psychology','awareness','brand','none','A stop loss is not a prediction; it is the price at which your idea expires','Single statement image in the MINTMOS voice. Calm, institutional, no hype.','Distils a core principle into a shareable line and reinforces the brand voice.','','Shares and reposts; follows.'),
  R('risk','education','cts','indirect','Why daily loss limits and trade caps protect your decisions','Explain how a cap on trades and daily loss removes the worst decisions rather than limiting opportunity.','Caps are unpopular until a trader sees the pattern of late-session losses; this reframes them as protection.','Complete Trading System sets a maximum number of trades per day and a post-loss protocol.','Saves; comments on whether they use a cap.'),
  R('planning','education','none','none','Five questions to answer before every order','Single checklist image of five plain-language questions covering direction, level, stop, size and reason.','A clean checklist is highly saveable and introduces the idea of structured pre-trade thinking without naming any product.','','Saves; screenshots shared to stories.'),
  R('community','engagement','engage','none','This week’s one rule: write down your max risk per trade','Challenge card asking followers to commit to a number in the comments.','Public commitment improves follow-through and closes the risk theme with an action.','','Comments with a number; tags of trading friends.')
 ]},
 { w:3, phase:1, theme:'Reading the market', why:'Teach market classification and multi-timeframe thinking: before a setup, know what the market is doing.',
   rows:[
  R('structure','education','cts','indirect','Trend, range or chop: classify the market before you look for a setup','Present the three market states as the first decision, with one visual cue per state and a rule for what to do in each.','Trading the wrong setup in the wrong state is a common reason valid rules fail; classification fixes it before entry.','Complete Trading System is built around classifying the market state first.','Saves; comments classifying their current chart.'),
  R('community','engagement','engage','none','Quiz: what state is this market in?','Single chart image created by the creator with a quiz question: trend, range or chop. Reveal in the comments after a day.','Active participation tests understanding and drives comments without any promotion.','','Answers in comments; return visits for the reveal.'),
  R('myths','education','cts','indirect','Myth: you should always have a position — chop is a no-trade state','Challenge the instinct that doing nothing is a failure, and present waiting as an active decision.','Overtrading in unclear conditions is a recurring problem; this speaks to it directly.','Complete Trading System treats a choppy market as a hard no-trade rule.','Shares; comments admitting to forcing trades.'),
  R('structure','education','pa','indirect','Market structure basics: higher highs, higher lows and what breaks them','Build the idea from first principles with simple visuals, ending on the difference between a pullback and a structural break.','Structure is the vocabulary for everything in Phase 2; teaching it first gives later content a shared foundation.','Price Action OS is built on a Trend + Level + Signal framework that starts with structure.','Saves; questions about specific patterns.'),
  R('levels','education','none','none','Support and resistance are zones, not lines','One image contrasting a single-line level with a zone that accounts for wicks and noise.','Corrects a common beginner error and primes the audience for the level-based content that follows.','','Saves and shares.'),
  R('indicators','education','tv','indirect','Top-down analysis: why the higher timeframe goes first','Explain the habit of reading the larger timeframe for direction before refining entries on a smaller one.','Prevents trading against the dominant direction, one of the simplest ways to remove low-quality trades.','TradingView Mastery covers a top-down timeframe system as part of its chart setup.','Saves; comments listing their timeframe stack.'),
  R('session','education','ict','indirect','Sessions as a filter: when you trade matters as much as what you trade','Explain sessions as a filter on setups rather than a prediction tool, without claiming specific outcomes.','Introduces timing early so later kill-zone content has context.','ICT & Smart Money Mastery includes a time and session strategy module.','Saves; comments on which session they trade.'),
  R('community','engagement','engage','none','Poll: which timeframe do you analyse first?','Question card with four timeframe options.','Reveals how the audience trades and tests whether the top-down message landed.','','Comments with timeframe and reason.')
 ]},

 ]},

/* Build the flat piece list; fails loudly if a week's row count does not match its template. */
function buildSeedPieces() {
  const out = [];
  WEEKS.forEach((wk, wi) => {
    const tpl = TEMPLATES[wk.phase];
    if (wk.rows.length !== tpl.length) throw new Error('Week ' + wk.w + ' has ' + wk.rows.length + ' rows, template needs ' + tpl.length);
    wk.rows.forEach((r, i) => {
      const [off, fmt] = tpl[i];
      const day = wi * 7 + off + 1;
      out.push({
        seedId: 's-d' + String(day).padStart(3, '0') + '-' + (out.filter(p => p.day === day).length + 1),
        day, format: fmt === 'C' ? 'carousel' : 'single',
        category: r.cat, objective: r.obj, badge: r.badge, intensity: r.int,
        subject: r.subject, angle: r.angle, why: r.why, link: r.link, response: r.resp
      });
    });
  });
  return out;
}

/* ---------------- Persistence: IndexedDB primary + localStorage mirror ---------------- */
const LS_KEY = 'mintmos_growth_os_state_v1', LS_SNAP = 'mintmos_growth_os_snaps_v1';
const Store = {
  mode: 'memory', db: null, timer: null, lastError: '',
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no indexedDB'));
        const r = indexedDB.open('mintmos-growth-os', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('snaps')) d.createObjectStore('snaps'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      this.mode = 'indexeddb';
    } catch (e) {
      this.lastError = String(e && e.message || e);
      try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); this.mode = 'localstorage'; } catch (e2) { this.mode = 'memory'; }
    }
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
  },
  idb(store, mode, fn) {
    return new Promise((res, rej) => { try { const tx = this.db.transaction(store, mode); const st = tx.objectStore(store); const rq = fn(st); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); } catch (e) { rej(e); } });
  },
  async load() {
    let a = null, b = null;
    if (this.db) { try { a = await this.idb('kv', 'readonly', s => s.get('state')); } catch (e) {} }
    try { const t = localStorage.getItem(LS_KEY); if (t) b = JSON.parse(t); } catch (e) {}
    const cands = [a, b].filter(Boolean);
    if (!cands.length) return null;
    return cands.sort((x, y) => ((y.meta && y.meta.lastSaved) || 0) - ((x.meta && x.meta.lastSaved) || 0))[0];
  },
  queue() { setIndicator('saving'); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 350); },
  async flush() {
    clearTimeout(this.timer); if (!S) return;
    S.meta.lastSaved = Date.now();
    let ok = false;
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); ok = true; } catch (e) { this.lastError = 'localStorage: ' + e.message; }
    if (this.db) { try { await this.idb('kv', 'readwrite', s => s.put(S, 'state')); ok = true; } catch (e) { this.lastError = 'indexedDB: ' + e.message; } }
    setIndicator(ok ? 'saved' : 'error');
  },
  async snapshot(reason) {
    if (!S) return;
    const snap = { at: Date.now(), reason, data: clone(S) };
    if (this.db) { try { await this.idb('snaps', 'readwrite', s => s.put(snap, String(snap.at))); await this.prune(); return true; } catch (e) {} }
    try { const a = JSON.parse(localStorage.getItem(LS_SNAP) || '[]'); a.unshift(snap); localStorage.setItem(LS_SNAP, JSON.stringify(a.slice(0, 2))); return true; } catch (e) { return false; }
  },
  async prune() {
    try { const keys = await this.idb('snaps', 'readonly', s => s.getAllKeys()); const old = keys.sort().slice(0, Math.max(0, keys.length - 8)); for (const k of old) await this.idb('snaps', 'readwrite', s => s.delete(k)); } catch (e) {}
  },
  async listSnaps() {
    let out = [];
    if (this.db) { try { const all = await this.idb('snaps', 'readonly', s => s.getAll()); out = all.map(x => ({ at: x.at, reason: x.reason, size: JSON.stringify(x.data).length })); } catch (e) {} }
    try { JSON.parse(localStorage.getItem(LS_SNAP) || '[]').forEach(x => { if (!out.some(o => o.at === x.at)) out.push({ at: x.at, reason: x.reason, size: JSON.stringify(x.data).length }); }); } catch (e) {}
    return out.sort((a, b) => b.at - a.at);
  },
  async getSnap(at) {
    if (this.db) { try { const s = await this.idb('snaps', 'readonly', st => st.get(String(at))); if (s) return s.data; } catch (e) {} }
    try { const x = JSON.parse(localStorage.getItem(LS_SNAP) || '[]').find(z => z.at === at); return x ? x.data : null; } catch (e) { return null; }
  }
};

/* ---------------- Analytics calculations ---------------- */
/* Formulas (all per-post, then averaged across posts):
   Engagement rate = (likes + comments + saves + shares) / reach
   Save rate = saves / reach      Share rate = shares / reach
   Profile visit rate = profile visits / reach      Link click rate = link clicks / reach
   Sales per click = sales / link clicks
   Posts without a reach value are excluded from rate averages and counted separately. */
function entryRates(e) {
  const r = num(e.reach), eng = num(e.likes) + num(e.comments) + num(e.saves) + num(e.shares);
  return { er: r > 0 ? eng / r * 100 : null, save: r > 0 ? num(e.saves) / r * 100 : null, share: r > 0 ? num(e.shares) / r * 100 : null, visit: r > 0 ? num(e.profileVisits) / r * 100 : null, click: r > 0 ? num(e.linkClicks) / r * 100 : null, conv: num(e.linkClicks) > 0 ? num(e.sales) / num(e.linkClicks) * 100 : null, eng };
}
function entryMeta(e) {
  const p = e.pieceId ? pieceById(e.pieceId) : null;
  const day = p ? p.day : (e.day || null);
  return { piece: p, title: p ? p.subject : (e.title || 'Untitled post'), format: p ? p.format : e.format, category: p ? p.category : e.category, badge: p ? p.badge : (e.badge || ''), hookId: (p && p.hookId) || e.hookId || '', day, week: day ? weekOfDay(day) : null, phase: day ? phaseOfDay(day) : null, objective: p ? p.objective : e.objective };
}
function aggregate(keyFn) {
  const g = {};
  S.analytics.forEach(e => {
    const m = entryMeta(e), k = keyFn(m, e); if (k == null || k === '') return;
    const x = g[k] || (g[k] = { key: k, n: 0, nRate: 0, er: [], save: [], share: [], visit: [], click: [], reach: 0, sales: 0, clicks: 0 });
    const r = entryRates(e); x.n++; x.reach += num(e.reach); x.sales += num(e.sales); x.clicks += num(e.linkClicks);
    if (r.er != null) { x.nRate++; x.er.push(r.er); x.save.push(r.save); x.share.push(r.share); x.visit.push(r.visit); x.click.push(r.click); }
  });
  return Object.values(g).map(x => Object.assign(x, { erAvg: mean(x.er), saveAvg: mean(x.save), shareAvg: mean(x.share), visitAvg: mean(x.visit), clickAvg: mean(x.click) }));
}

/* ---------------- Promotion balance ---------------- */
function promotionBalance() {
  const pcs = S.pieces.filter(p => p.day), promo = pcs.filter(p => p.intensity === 'soft' || p.intensity === 'direct');
  const rows = activeProducts().map(pr => {
    const mine = pcs.filter(p => p.badge === pr.id), pm = mine.filter(p => p.intensity === 'soft' || p.intensity === 'direct');
    const share = promo.length ? pm.length / promo.length * 100 : 0;
    let flag = 'ok', msg = 'Balanced';
    if (pr.status === 'ready' && pm.length < S.settings.minPromo) { flag = 'low'; msg = 'Insufficient: fewer than ' + S.settings.minPromo + ' soft or direct promotions for a publish-ready product.'; }
    else if (share > S.settings.maxShare) { flag = 'high'; msg = 'Excessive: ' + Math.round(share) + '% of all promotional posts (limit ' + S.settings.maxShare + '%).'; }
    else if (pr.status !== 'ready' && pm.length === 0) { flag = 'info'; msg = 'No promotion planned. Fine while the product is ' + PRODUCT_STATUS[pr.status].toLowerCase() + '.'; }
    else if (pr.status !== 'ready' && pm.some(p => p.intensity === 'direct')) { flag = 'warn'; msg = 'Direct promotion is planned while the product is ' + PRODUCT_STATUS[pr.status].toLowerCase() + '. Confirm readiness before publishing.'; }
    return { product: pr, total: mine.length, promo: pm.length, direct: mine.filter(p => p.intensity === 'direct').length, soft: mine.filter(p => p.intensity === 'soft').length, indirect: mine.filter(p => p.intensity === 'indirect').length, share, flag, msg };
  });
  const ratio = pcs.length ? promo.length / pcs.length * 100 : 0;
  const perPhase = [1, 2, 3].map(ph => { const q = pcs.filter(p => phaseOfDay(p.day) === ph); const pr = q.filter(p => p.intensity === 'soft' || p.intensity === 'direct'); return { phase: ph, total: q.length, promo: pr.length, ratio: q.length ? pr.length / q.length * 100 : 0 }; });
  return { rows, ratio, perPhase, promoCount: promo.length, total: pcs.length };
}

/* ---------------- Similarity / gaps ---------------- */
const STOP = new Set('the a an and or of to in on for with your you is are it that this what why how from at as by be not do does did can will vs more than into over before after about one two three just only'.split(' '));
function tokens(t) { return new Set(String(t || '').toLowerCase().replace(/[^a-z0-9\s:]/g, ' ').split(/\s+/).map(w => w.replace(/(ing|ed|es|s)$/, '')).filter(w => w.length > 2 && !STOP.has(w))); }
function similarity(a, b) { const A = tokens(a), B = tokens(b); if (!A.size || !B.size) return 0; let i = 0; A.forEach(x => { if (B.has(x)) i++; }); return i / (A.size + B.size - i); }
function findDuplicates(threshold) {
  const th = threshold || S.settings.dupThreshold, items = [];
  S.pieces.forEach(p => items.push({ type: 'piece', id: p.id, text: p.subject, label: p.subject, where: p.day ? 'Day ' + p.day : 'Unscheduled' }));
  S.ideas.forEach(i => items.push({ type: 'idea', id: i.id, text: i.title, label: i.title, where: 'Idea' }));
  const out = [];
  for (let a = 0; a < items.length; a++) for (let b = a + 1; b < items.length; b++) { const s = similarity(items[a].text, items[b].text); if (s >= th) out.push({ a: items[a], b: items[b], score: s }); }
  return out.sort((x, y) => y.score - x.score);
}
function similarTo(text, excludeId) {
  const th = Math.max(0.3, S.settings.dupThreshold - 0.1), out = [];
  S.pieces.forEach(p => { if (p.id !== excludeId) { const s = similarity(text, p.subject + ' ' + p.angle); const s2 = similarity(text, p.subject); const m = Math.max(s, s2); if (m >= th) out.push({ type: 'piece', label: p.subject, where: p.day ? 'Day ' + p.day : 'Unscheduled', score: m }); } });
  S.ideas.forEach(i => { if (i.id !== excludeId) { const s = similarity(text, i.title); if (s >= th) out.push({ type: 'idea', label: i.title, where: 'Idea Laboratory', score: s }); } });
  return out.sort((a, b) => b.score - a.score).slice(0, 4);
}
function topicCoverage() {
  const corpusPieces = S.pieces.filter(p => p.day).map(p => ({ id: p.id, t: (p.subject + ' ' + p.angle + ' ' + p.why).toLowerCase(), p }));
  const corpusIdeas = S.ideas.map(i => ({ id: i.id, t: (i.title + ' ' + i.notes).toLowerCase(), i }));
  return S.topics.map(t => {
    const hit = c => t.kw.some(k => c.t.includes(k.toLowerCase()));
    const pcs = corpusPieces.filter(hit), ids = corpusIdeas.filter(hit);
    return { topic: t, pieces: pcs.length, ideas: ids.length, status: pcs.length === 0 ? (ids.length ? 'idea-only' : 'gap') : pcs.length === 1 ? 'thin' : 'covered', pieceList: pcs.map(x => x.p), ideaList: ids.map(x => x.i) };
  });
}
function gapScore(g) { return Math.round((num(g.userValue) * 0.35 + num(g.differentiation) * 0.2 + num(g.practicality) * 0.25 + num(g.commercial) * 0.2) * 20); }

function insights() {

  const best = (rows, key, minN) => rows.filter(r => r.nRate >= minN).sort((a, b) => b[key] - a[key])[0];
  const groups = [['category', aggregate(m => m.category), k => catLabel(k)], ['format', aggregate(m => m.format), k => FORMATS[k] || k], ['product / badge', aggregate(m => m.badge), k => badgeInfo(k).name]];
  [['saveAvg', 'save rate', overall.save, 'Saves signal reference value: make more of this.'], ['shareAvg', 'share rate', overall.share, 'Shares signal reach potential: use it for awareness posts.']].forEach(([key, lab, base, tip]) => {
    groups.forEach(([gn, rows, lf]) => { const b = best(rows, key, 2); if (b && rows.filter(r => r.nRate >= 2).length >= 2 && b[key] > base * 1.2) out.push({ cls: b.nRate >= 3 ? 'ok' : 'warn', t: '<b>' + esc(lf(b.key)) + '</b> (' + gn + ') leads on ' + lab + ': ' + fmtPct(b[key]) + ' vs ' + fmtPct(base) + ' average across all posts (n=' + b.nRate + '). ' + (b.nRate >= 3 ? tip : 'Early signal — repeat it before drawing conclusions.') }); });
  });
  const fm = aggregate(m => m.format), c = fm.find(x => x.key === 'carousel'), s = fm.find(x => x.key === 'single');
  if (c && s && c.nRate >= 2 && s.nRate >= 2) out.push({ cls: '', t: 'Carousels average ' + fmtPct(c.erAvg) + ' engagement and ' + fmtPct(c.saveAvg) + ' saves; single images average ' + fmtPct(s.erAvg) + ' and ' + fmtPct(s.saveAvg) + '. ' + (c.saveAvg > s.saveAvg * 1.2 ? 'Carousels earn more saves — keep teaching content in carousels.' : s.saveAvg > c.saveAvg * 1.2 ? 'Single images earn more saves than carousels at the moment.' : 'The two formats perform similarly so far.') });
  const pro = [], edu = []; S.analytics.forEach(e => { const m = entryMeta(e), r = entryRates(e); if (r.er == null || !m.piece) return; (m.piece.intensity === 'soft' || m.piece.intensity === 'direct' ? pro : edu).push(r.er); });
  if (pro.length >= 2 && edu.length >= 2) { const a = mean(pro), b = mean(edu); out.push({ cls: a < b * 0.7 ? 'warn' : '', t: 'Promotional posts (soft or direct) average ' + fmtPct(a) + ' engagement vs ' + fmtPct(b) + ' for non-promotional posts (n=' + pro.length + ' vs ' + edu.length + '). ' + (a < b * 0.7 ? 'Promotion is engaging noticeably less: lead with the lesson and keep the product mention light.' : 'Promotion is not hurting engagement so far.') }); }
  const hk = aggregate(m => m.hookId).filter(r => r.nRate >= 1).sort((a, b) => b.erAvg - a.erAvg)[0]; if (hk) { const h = S.hooks.find(x => x.id === hk.key); if (h) out.push({ cls: '', t: 'Best hook so far: “' + esc(h.text.slice(0, 90)) + '” at ' + fmtPct(hk.erAvg) + ' engagement (n=' + hk.nRate + ').' }); }
  const sales = aggregate(m => m.badge).filter(r => r.sales > 0).sort((a, b) => b.sales - a.sales)[0]; if (sales) out.push({ cls: 'ok', t: 'Most recorded sales came from <b>' + esc(badgeInfo(sales.key).name) + '</b> content (' + sales.sales + ' from ' + sales.clicks + ' link clicks).' });

const WEEK_Q = [['q1', 'What was published?'], ['q2', 'Which topics performed well?'], ['q3', 'Which content generated the most saves?'], ['q4', 'Which content generated the most shares?'], ['q5', 'Which products received exposure?']];
const PHASE_Q = [['pq1', 'Was the phase objective achieved? What is the evidence?'], ['pq2', 'What did the audience tell you (comments, messages, questions)?'], ['pq3', 'Have any product statuses changed that affect the next phase?'], ['pq4', 'What will you change in the next phase?']];
function reviewData(k) {
  const isW = k[0] === 'w', i = +k.slice(1), a = isW ? (i - 1) * 7 + 1 : (i - 1) * 35 + 1, b = isW ? i * 7 : i * 35;
  const pcs = S.pieces.filter(p => p.day >= a && p.day <= b), pub = pcs.filter(isPub), st = computeStats();
  const days = { completed: 0, partial: 0, missed: 0, skipped: 0, overdue: 0 }; for (let n = a; n <= b; n++) if (days[st.dayStatus[n]] !== undefined) days[st.dayStatus[n]]++;
  const exp = {}; pub.forEach(p => { exp[p.badge] = (exp[p.badge] || 0) + 1; });
  const es = S.analytics.map(e => ({ e, m: entryMeta(e), r: entryRates(e) })).filter(x => x.m.day >= a && x.m.day <= b && x.r.er != null);
  const topS = es.slice().sort((x, y) => y.r.save - x.r.save)[0], topH = es.slice().sort((x, y) => y.r.share - x.r.share)[0];
  return { isW, i, a, b, pcs, pub, days, exp, topS, topH, es, car: pub.filter(p => p.format === 'carousel').length, sing: pub.filter(p => p.format === 'single').length };
}
function reviewList() { const out = []; for (let w = 1; w <= TOTAL_WEEKS; w++) out.push('w' + w); [1, 2, 3].forEach(p => out.push('p' + p)); return out; }
Views.reviews = function () {

    h += revCard('p' + ph, st) + '</div>';
  });

};
function revCard(k, st) {

function searchAll(q) {

  S.products.forEach(p => { if (hit(p.name + ' ' + p.short + ' ' + p.overview + ' ' + (p.features || []).join(' ') + ' ' + (p.problems || []).join(' '))) out.push({ type: 'Product', id: p.id, title: p.name, sub: productLabel(p) + ' · ' + PRODUCT_STATUS[p.status], act: 'product' }); });
  S.campaigns.forEach(c => { if (hit(c.name + ' ' + c.objective + ' ' + c.notes)) out.push({ type: 'Campaign', id: c.id, title: c.name, sub: c.type, act: 'campaign' }); });
  S.structures.forEach(s => { if (hit(s.name + ' ' + s.purpose)) out.push({ type: 'Structure', id: s.id, title: s.name, sub: 'Carousel structure', act: 'structure' }); });
  S.competitors.forEach(c => { if (hit(c.name + ' ' + (c.strategies || '') + ' ' + (c.lessons || ''))) out.push({ type: 'Competitor', id: c.id, title: c.name, sub: 'Competitor', act: 'competitor' }); });
  S.swipes.forEach(s => { if (hit(s.title + ' ' + (s.observation || ''))) out.push({ type: 'Swipe file', id: s.id, title: s.title, sub: 'Reference', act: 'swipe' }); });
  S.gaps.forEach(g => { if (hit(g.title + ' ' + g.rationale)) out.push({ type: 'Product gap', id: g.id, title: g.title, sub: g.type, act: 'gap' }); });
  return out;
}
function searchResultsHTML(q) {
  if (q.trim().length < 2) return '<div class="empty-s">Type at least two characters to search the roadmap, ideas, hooks, products, campaigns, structures, competitors and the swipe file.</div>';
  const r = searchAll(q); if (!r.length) return '<div class="empty-s">Nothing found for “' + esc(q) + '”.</div>';
  const groups = {}; r.forEach(x => (groups[x.type] = groups[x.type] || []).push(x));
  return Object.entries(groups).map(([g, items]) => '<div class="sr-g"><div class="sr-gt">' + g + ' · ' + items.length + '</div>' + items.slice(0, 8).map(x => '<button class="sr" data-act="search-open" data-kind="' + x.act + '" data-id="' + x.id + '"><b>' + esc(x.title.slice(0, 110)) + '</b><small>' + esc(x.sub) + '</small></button>').join('') + (items.length > 8 ? '<div class="muted sm">+ ' + (items.length - 8) + ' more — refine your search</div>' : '') + '</div>').join('');
}
Act.search = () => {
  if (UI.modals.some(m => m.search)) return;
  const m = openModal({ title: 'Search everything', size: 'lg', html: '<input id="gsearch" class="gs-in" type="search" placeholder="Search ideas, hooks, products, campaigns and the 105-day roadmap…" autocomplete="off" aria-label="Search everything"><div id="gsResults" class="gs-res">' + searchResultsHTML('') + '</div>', buttons: [{ label: 'Close', cls: 'ghost', onClick: mm => mm.close() }] });
  m.search = true; const inp = $('#gsearch', m.el); inp.focus();
  inp.addEventListener('input', () => { $('#gsResults', m.el).innerHTML = searchResultsHTML(inp.value); });
};
Act['search-open'] = el => {
  const kind = el.dataset.kind, id = el.dataset.id; closeTopModal();
  const open = { piece: () => Act['open-piece']({ dataset: { id } }), idea: () => { UI.f.ideas = {}; go('ideas'); const i = S.ideas.find(x => x.id === id); if (i) ideaForm(i, 'Edit idea'); }, hook: () => { UI.f.hooks = {}; go('hooks'); const k = S.hooks.find(x => x.id === id); if (k) hookForm(k, 'Edit hook'); }, product: () => { UI.f.products = { tab: 'studio', sel: id }; UI.params.productId = id; go('products'); }, campaign: () => { go('campaigns'); const c = S.campaigns.find(x => x.id === id); if (c) Act['camp-content']({ dataset: { id } }); }, structure: () => { UI.f.architect = {}; go('architect'); const s = S.structures.find(x => x.id === id); if (s) structForm(s, 'Edit structure'); }, competitor: () => { UI.f.competitors = { tab: 'competitors' }; go('competitors'); const c = S.competitors.find(x => x.id === id); if (c) compForm(c); }, swipe: () => { UI.f.competitors = { tab: 'swipe' }; go('competitors'); const s = S.swipes.find(x => x.id === id); if (s) swipeForm(s); }, gap: () => { UI.f.products = { tab: 'gaps' }; go('products'); const g = S.gaps.find(x => x.id === id); if (g) gapForm(g); } };
  if (open[kind]) setTimeout(open[kind], 20);
};
Act.capture = () => {
  if (UI.modals.some(m => m.capture)) return;
  const m = formModal({ title: 'Quick capture', size: 'md', pre: '<p class="muted">Save an idea in seconds. Refine it later in the Idea Laboratory.</p>', fields: [{ k: 'title', label: 'Idea', type: 'text', req: true, full: true, ph: 'What is the idea?' }, { k: 'format', label: 'Format', type: 'select', opts: () => fmtOpts() }, { k: 'product', label: 'Product', type: 'select', opts: () => productOptions('No product') }, { k: 'notes', label: 'Note', type: 'textarea', rows: 2 }], values: { format: 'carousel', product: '' }, submitLabel: 'Save idea',
    onSubmit: async v => { if (!(await dupGate(v.title))) return false; S.ideas.unshift(Object.assign({ id: uid(), fav: false, created: Date.now(), kind: 'idea', category: 'foundations', objective: 'education', priority: 'medium', status: 'new' }, v)); save(); render(); toast('Idea captured'); } });
  m.capture = true;
};
Act['open-review-from'] = () => {};

/* ---------------- Boot ---------------- */
async function boot() {
  await Store.init();
  let loaded = null; try { loaded = await Store.load(); } catch (e) { console.error(e); }
  try {
    if (loaded) { S = migrate(loaded); }
    else { S = newState(); mergeSeed(S); migrate(S); }
  } catch (e) {
    console.error('State load failed, starting fresh', e);
    try { localStorage.setItem('mintmos_corrupt_backup', JSON.stringify(loaded)); } catch (e2) {}
    S = newState(); mergeSeed(S); migrate(S); setTimeout(() => toast('Saved data could not be read. A copy was kept in browser storage; starting from the default plan.', 'err'), 500);
  }
  const hv = (location.hash || '').slice(1); if (Views[hv]) UI.view = hv;
  renderNav(); render(false);
  Store.flush();
  window.addEventListener('hashchange', () => { const v = (location.hash || '').slice(1); if (Views[v] && v !== UI.view) go(v); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); });
  window.addEventListener('pagehide', () => Store.flush());
  $('#menuBtn').addEventListener('click', () => $('#side').classList.toggle('open'));
  window.__ready = true;
}
window.addEventListener('error', e => { console.error('Unhandled error', e.message); });
boot();

</script>
